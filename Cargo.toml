[workspace]
resolver = "2"
members = ["crates/core", "crates/dict-builder", "crates/app", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/kingbone2006/off-dict"

[workspace.dependencies]
vietdict-core = { path = "crates/core" }
rusqlite = { version = "0.43", default-features = false, features = ["bundled", "cache"] }
fst = { version = "0.4.7", features = ["levenshtein"] }
memmap2 = "0.9"
unicode-normalization = { version = "0.1.26", default-features = false, features = ["std"] }
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
directories = "6"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false

[profile.release-small]
inherits = "release"
opt-level = "z"

[profile.dev.package."*"]
opt-level = 1
