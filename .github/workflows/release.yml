name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: vietdict.exe
            archive: VietDict-windows-x64.zip
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: vietdict
            archive: VietDict-linux-x64.tar.gz
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            binary: vietdict
            archive: VietDict-macos-x64.tar.gz

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build demo dictionary data
        shell: bash
        run: |
          mkdir -p data/build
          cargo run -p dict-builder -- sqlite data/demo.jsonl --out data/build --version demo-0.1.0
      - name: Build binary
        run: cargo build --release -p app --target ${{ matrix.target }}
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/VietDict/data | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/VietDict/
          Copy-Item README.md,LICENSE,data/LICENSES.md dist/VietDict/
          Copy-Item data/build/* dist/VietDict/data/
          Compress-Archive -Path dist/VietDict/* -DestinationPath "dist/${{ matrix.archive }}"
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          iscc.exe packaging/windows/VietDict.iss
          Copy-Item dist/VietDict-windows-x64-setup.exe dist/

      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist/VietDict/data
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/VietDict/
          cp README.md LICENSE data/LICENSES.md dist/VietDict/
          cp -r data/build/* dist/VietDict/data/
          tar -C dist -czf "dist/${{ matrix.archive }}" VietDict
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/${{ matrix.archive }}
            dist/VietDict-windows-x64-setup.exe

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        shell: bash
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS.txt
